<h2 mat-dialog-title>
  {{ data.activate ? 'Activar estante' : 'Desactivar estante' }}
</h2>

<mat-dialog-content>
  <p class="dm-location-confirm__text">
    @if (data.activate) {
      ¿Activar <strong>{{ data.name }}</strong
      >? Volverá a estar disponible para asignar medicamentos.
    } @else {
      ¿Desactivar <strong>{{ data.name }}</strong
      >? Dejará de estar disponible para asignar medicamentos.
    }
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="undefined">Cancelar</button>
  @if (data.activate) {
    <button mat-flat-button type="button" color="primary" [mat-dialog-close]="true">Activar</button>
  } @else {
    <button mat-flat-button type="button" color="warn" [mat-dialog-close]="true">Desactivar</button>
  }
</mat-dialog-actions>
